name: Release

# Cut a release by tagging the version that manifest.json already declares:
#   git tag v1.2.0 && git push origin v1.2.0
# The job below refuses to publish if the tag and manifest disagree.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi
          echo "Releasing v${manifest_version}"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # scripts/package.sh also asserts the archive layout and size limit.
      - name: Build plugin ZIP
        run: npm run package

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" slack-status-sync.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
