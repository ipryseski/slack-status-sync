name: Release

# Cut a release by tagging the version that manifest.json already declares:
#   git tag v1.2.0 && git push origin v1.2.0
# The job below refuses to publish if the tag and manifest disagree.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check tag matches manifest.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest.json version ${manifest_version}"
            exit 1
          fi
          echo "Releasing v${manifest_version}"

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build plugin ZIP
        run: npm run package

      - name: Verify archive layout
        # Super Productivity's extractor indexes entries by flat filename, so
        # anything nested (or missing) makes the plugin fail to load.
        run: |
          unzip -l slack-status-sync.zip
          entries="$(unzip -Z1 slack-status-sync.zip)"
          if printf '%s\n' "$entries" | grep -q '/'; then
            echo "::error::Archive contains nested paths; entries must sit at the root"
            exit 1
          fi
          for f in manifest.json plugin.js index.html icon.svg; do
            printf '%s\n' "$entries" | grep -qx "$f" || {
              echo "::error::Archive is missing ${f}"; exit 1; }
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" slack-status-sync.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
